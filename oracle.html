<style>:root{--ground:#50163C; --wine:#682047; --candy:#FE9DCA; --paper:#FFE3F1; --cream:#FFF7F4; --ink:#3B1230; --magenta:#C2246E; --plum:#50163C; --gold:#E9B949; --cool:#B9B3F5; --white:#FFFFFF; --didone:'Fraunces',Georgia,'Times New Roman',serif; --tag:'Bricolage Grotesque','Arial Narrow','Helvetica Neue',Arial,sans-serif; --body:'Fraunces',Georgia,'Times New Roman',serif; --marker:'Permanent Marker','Permanent Marker','Marker Felt','Chalkboard SE','Comic Sans MS',cursive; --script:'Pinyon Script','Snell Roundhand','Apple Chancery',cursive; --mono:'DM Mono','Courier New',monospace; --pixel:'Silkscreen','Pixelify Sans','Courier New',monospace;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--cream);color:var(--ink);font-family:var(--body);
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.tag{font-family:var(--tag);text-transform:uppercase;letter-spacing:.12em;font-weight:800}
.didone{font-family:var(--didone)}
.marker{font-family:var(--marker);color:var(--magenta)}
.hand{font-family:var(--marker);color:var(--ink)}
.lined{background-color:var(--paper);
  background-image:linear-gradient(90deg,transparent 15mm,color-mix(in srgb,var(--magenta) 55%,transparent) 15mm,color-mix(in srgb,var(--magenta) 55%,transparent) 15.4mm,transparent 15.4mm),
  repeating-linear-gradient(180deg,transparent 0,transparent 6.6mm,var(--candy) 6.6mm,var(--candy) 7mm);}
.grain{position:relative}
.grain::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .1  0 0 0 0 .2  0 0 0 .35 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}
.box{width:3.6mm;height:3.6mm;border:.45mm solid var(--ink);border-radius:.6mm;display:inline-block;flex:none}
:root{--cw:70mm;--ch:120mm}
.card{position:absolute;width:var(--cw);height:var(--ch);overflow:hidden;container-type:size}
.face{position:absolute;inset:0;display:flex;flex-direction:column;padding:4.4cqw 7.2cqw 4.6cqw;isolation:isolate;
  --accent-c:var(--candy);--fg:var(--ink);--st:var(--paper);--dot:color-mix(in srgb,var(--candy) 55%,transparent);
  --md:var(--plum);--ml:var(--cream);--exb:var(--plum);--exf:var(--cream);color:var(--fg);--dots:var(--dots-a)}
.m-cyberpunk{--dots:var(--dots-c);--fg:var(--cream);--st:var(--plum);--dot:color-mix(in srgb,var(--candy) 22%,transparent);--md:var(--wine);
  --ml:var(--candy);--exb:var(--candy);--exf:var(--ink)}
.m-y2k-blog{--dots:var(--dots-y);--st:var(--cream);--dot:color-mix(in srgb,var(--magenta) 16%,transparent);--exb:var(--wine)}
.stock{position:absolute;inset:0;z-index:-3;background-color:var(--st);
  background-image:var(--dots);background-size:1.7cqw 1.7cqw}
.stock::after{content:"";position:absolute;inset:0;background:var(--grain) 0 0/24cqw 24cqw;opacity:.9}
.m-cyberpunk .stock::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(180deg,rgba(255,247,244,.05) 0 .35cqw,transparent .35cqw .9cqw)}
.m-y2k-blog .stock{background-image:var(--tile),var(--dots);
  background-size:9cqw 9cqw,1.7cqw 1.7cqw}
.frame{position:absolute;inset:2.4cqw;border:.45cqw solid var(--gold);outline:.22cqw solid var(--gold);
  outline-offset:-1.5cqw;z-index:-2;pointer-events:none}
.corners i{position:absolute;width:10cqw;height:10cqw;z-index:-1}
.corners svg{width:100%;height:100%;display:block}
.corners .c1{fill:none;stroke:var(--gold);stroke-width:1.6}.corners .c2{fill:none;stroke:var(--gold);stroke-width:.8}
.corners .c3{fill:none;stroke:var(--gold);stroke-width:1}.corners .cs{fill:var(--gold)}
.corners .k0{left:1.1cqw;top:1.1cqw}.corners .k1{right:1.1cqw;top:1.1cqw;transform:scaleX(-1)}
.corners .k2{left:1.1cqw;bottom:1.1cqw;transform:scaleY(-1)}.corners .k3{right:1.1cqw;bottom:1.1cqw;transform:scale(-1,-1)}
.moonstrip{display:block;flex:none;width:54cqw;height:5.4cqw;margin:0 auto}
.moonstrip .md{fill:var(--md);stroke:var(--gold);stroke-width:1.4}.moonstrip .ml{fill:var(--ml)}.moonstrip .ms{fill:var(--gold)}
.head{flex:none;display:flex;justify-content:space-between;align-items:center;height:8.6cqw;margin-top:1.4cqw}
.kick{font-family:var(--mono);font-size:2.45cqw;letter-spacing:.2em;text-transform:uppercase;color:var(--magenta);
  border:.32cqw solid var(--magenta);border-radius:.5cqw;padding:.5cqw 1.3cqw;transform:rotate(-2deg);
  -webkit-mask-image:var(--stamp);mask-image:var(--stamp);-webkit-mask-size:30cqw;mask-size:30cqw}
.m-cyberpunk .kick{font-family:var(--pixel);letter-spacing:.08em;color:var(--candy);border-color:var(--candy)}
.ransom{display:inline-flex;align-items:center;gap:.5cqw;line-height:1;white-space:nowrap}
.ransom span{display:inline-block;padding:.1em .13em .06em;box-shadow:.25cqw .35cqw .5cqw rgba(30,6,24,.32);
  clip-path:polygon(2% 4%,30% 0,62% 3%,98% 0,100% 40%,97% 96%,64% 100%,30% 97%,0 100%,3% 52%)}
.ransom .sp{display:inline-block;width:.35em}
.ransom.num{font-size:7.4cqw}
.ransom .r1{font-family:var(--didone);font-weight:900;background:var(--cream);color:var(--ink)}
.ransom .r2{font-family:var(--tag);font-weight:800;background:var(--plum);color:var(--cream)}
.ransom .r3{font-family:var(--pixel);font-weight:700;background:var(--candy);color:var(--ink)}
.ransom .r4{font-family:var(--mono);font-weight:500;background:var(--gold);color:var(--ink)}
.ransom .r5{font-family:var(--didone);font-style:italic;font-weight:900;background:var(--wine);color:var(--candy)}
.ransom .r6{font-family:var(--tag);font-weight:800;background:#fff;color:transparent;-webkit-text-stroke:.09em var(--ink)}
.hero{flex:1 1 auto;min-height:0;position:relative;margin:.6cqw -3cqw 0}
.hero .disc{position:absolute;width:44cqw;height:44cqw;border-radius:50%;left:6cqw;top:50%;transform:translateY(-50%);
  background:var(--disc) 0 0/2.2cqw 2.2cqw;opacity:.75}
.m-cyberpunk .hero .disc{opacity:.45}
.hero .disc.r{left:auto;right:6cqw}
.obj{position:absolute;display:block;object-fit:contain;transform:rotate(var(--rot));
  filter:drop-shadow(.5cqw 0 0 #fff) drop-shadow(-.5cqw 0 0 #fff) drop-shadow(0 .5cqw 0 #fff) drop-shadow(0 -.5cqw 0 #fff)
  drop-shadow(.4cqw 1.4cqw 1.2cqw rgba(30,6,24,.42))}
.obj.major{right:-2cqw;top:0;height:100%;max-width:78cqw}
.obj.minor{top:4%;height:88%;max-width:56cqw}
.obj.minor.l{left:5cqw}.obj.minor.r{right:5cqw}
.obj.second{top:2%;height:38%;max-width:30cqw}
.obj.second.l{right:6cqw}.obj.second.r{left:6cqw}
.obj.pip{transform:translate(-50%,-50%) rotate(var(--rot));max-width:30cqw;width:auto}
.hero.pips .disc{left:50%;transform:translate(-50%,-50%)}
.ransom.court{position:absolute;top:46%;z-index:3;font-size:8.6cqw;transform:rotate(-4deg)}
.ransom.court.l{right:5cqw}.ransom.court.r{left:5cqw}
.hero.type{display:flex;align-items:center;justify-content:center}
.hero.type .disc{left:50%;transform:translate(-50%,-50%);width:52cqw;height:52cqw}
.ransom.big{position:relative;z-index:2;transform:rotate(-3deg);font-size:22cqw}
.ransom.big span{box-shadow:.5cqw .8cqw 1cqw rgba(30,6,24,.35)}
.pix{position:relative;z-index:2;height:88%;width:auto;max-width:66cqw;transform:rotate(var(--rot));
  filter:drop-shadow(.7cqw 0 0 #fff) drop-shadow(-.7cqw 0 0 #fff) drop-shadow(0 .7cqw 0 #fff) drop-shadow(0 -.7cqw 0 #fff)
  drop-shadow(.4cqw 1.4cqw 1.2cqw rgba(30,6,24,.42))}
.pstar{position:absolute;width:7cqw;height:7cqw;z-index:3}.pstar.a{left:9cqw;top:8%}.pstar.b{right:10cqw;bottom:22%;width:4.6cqw;height:4.6cqw}
.fig{position:absolute;left:2.4cqw;bottom:24%;font-family:var(--mono);font-size:2.1cqw;letter-spacing:.14em;
  color:var(--fg);opacity:.75;transform:rotate(-90deg);transform-origin:left bottom;white-space:nowrap}
.nm{flex:none;position:relative;z-index:3;margin-top:-7cqw}
.name{position:relative;font-family:var(--didone);font-weight:900;font-size:9.4cqw;line-height:.94;letter-spacing:-.025em;
  color:var(--fg);font-variation-settings:'opsz' 144;text-wrap:balance}
.name::after{content:attr(data-r);position:absolute;inset:0;transform:translate(.85cqw,.7cqw);color:var(--sa);z-index:-1;
  text-wrap:balance}
.m-cyberpunk .name::after{mix-blend-mode:normal}
.ttl{font-family:var(--marker);color:var(--magenta);font-size:5cqw;line-height:1.1;margin-top:.6cqw;transform:rotate(-2deg);
  transform-origin:left center;white-space:nowrap}
.m-cyberpunk .ttl{color:var(--candy)}
.slip{flex:none;position:relative;background:#FFFBF8;color:var(--ink);margin:3cqw -1cqw 0;padding:3.2cqw 3.6cqw 3cqw;
  transform:rotate(var(--slr,-.7deg));box-shadow:0 .5cqw 0 rgba(59,18,48,.08),0 1.4cqw 2.4cqw rgba(30,6,24,.3)}
.slip .tape{position:absolute;top:-2.3cqw;left:var(--tx,50%);width:21cqw;height:4.8cqw;margin-left:-10.5cqw;transform:rotate(var(--tr,-3deg));
  background:color-mix(in srgb,var(--sa) 78%,transparent);
  clip-path:polygon(0 8%,4% 0,9% 10%,14% 0,100% 0,96% 12%,100% 24%,95% 38%,100% 52%,96% 66%,100% 80%,95% 92%,100% 100%,0 100%,4% 86%,0 72%,5% 58%,0 44%,4% 30%,0 18%)}
.m-cyberpunk .slip .tape{mix-blend-mode:normal}
.structure{font-family:var(--mono);font-size:3.42cqw;line-height:1.5;letter-spacing:-.01em}
.blank{background:color-mix(in srgb,var(--candy) 82%,transparent);padding:.04em .18em;margin:0;border-radius:.35em .6em .4em .55em;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;font-weight:500}
.br{display:none}
.wbar{display:flex;align-items:center;gap:1.4cqw;margin:-3.2cqw -3.6cqw 2.2cqw;padding:1cqw 2cqw;background:var(--plum);
  color:var(--cream);font-family:var(--pixel);font-size:2.5cqw;letter-spacing:.06em}
.wbar .btns i{display:inline-block;width:1.8cqw;height:1.8cqw;background:var(--gold);margin-right:.6cqw}
.prompt{font-family:var(--mono);font-size:2.5cqw;color:var(--magenta);margin-bottom:1.2cqw}
.prompt .cur{display:inline-block;width:1.4cqw;height:2.6cqw;background:var(--candy);vertical-align:-.4cqw;margin-left:.8cqw}
.ex{flex:none;margin:2.8cqw -2.4cqw 0;padding:3.1cqw 5cqw 3.1cqw;background:var(--exb);color:var(--exf);font-family:var(--body);
  font-style:italic;font-size:3.12cqw;line-height:1.34;transform:rotate(var(--exr,.9deg))}
.stub{flex:none;position:relative;display:grid;grid-template-columns:1fr 18cqw;gap:2.4cqw;align-items:end;
  margin-top:2.6cqw;padding-top:2.2cqw;border-top:.32cqw dashed var(--fg)}
.stub .sc{position:absolute;left:-1.6cqw;top:-3cqw;font-size:4.2cqw;line-height:1;color:var(--fg);
  font-family:'Apple Symbols','Segoe UI Symbol','DejaVu Sans',sans-serif;background:var(--st);padding:0 .6cqw}
.when{font-family:var(--mono);font-size:2.42cqw;line-height:1.38}
.when b{display:inline-block;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--magenta);
  border:.28cqw solid var(--magenta);padding:.2cqw .9cqw;margin-right:1.2cqw;transform:rotate(-1.5deg);
  -webkit-mask-image:var(--stamp);mask-image:var(--stamp);-webkit-mask-size:24cqw;mask-size:24cqw}
.m-cyberpunk .when b{color:var(--candy);border-color:var(--candy)}
.code{display:flex;flex-direction:column;align-items:stretch;gap:.6cqw}
.bc{display:block;width:100%;height:6.4cqw;fill:var(--fg)}
.no{font-family:var(--mono);font-size:2cqw;letter-spacing:.1em;text-align:center;white-space:nowrap}
.mk{position:absolute;z-index:4;pointer-events:none}
.mk.washi{width:24cqw;height:5cqw;opacity:.92;
  background:var(--washi) 0 .1cqw/2.4cqw 2.4cqw,color-mix(in srgb,var(--plum) 85%,transparent);
  clip-path:polygon(0 0,100% 0,97% 20%,100% 40%,97% 60%,100% 80%,98% 100%,0 100%,3% 80%,0 60%,3% 40%,0 20%)}
.mk.hearts{display:flex;gap:1cqw;width:20cqw;height:5cqw}.mk.hearts svg{width:5cqw;height:5cqw}
.mk.pstar{width:6cqw;height:6cqw}
/* short cards (mini) lose the example; the stub stays */
@container (min-aspect-ratio: 2/3){.ex{display:none}.face{padding-top:3.6cqw}.nm{margin-top:-5cqw}}
/* back */
.bk{--dots:var(--dots-c);--st:var(--plum);--fg:var(--cream);--dot:color-mix(in srgb,var(--candy) 20%,transparent);--md:var(--wine);--ml:var(--cream)}
.bk.m-y2k-blog{--st:var(--plum)}
.bk .moonstrip{position:absolute;left:50%;transform:translateX(-50%);width:66cqw;height:6.6cqw}
.bk .moonstrip.top{top:7%}.bk .moonstrip.mid{top:58%}
.staple{position:absolute;top:1.6cqw;width:13cqw;height:2cqw;border-radius:.5cqw;z-index:6;
  background:linear-gradient(180deg,#8d8a92,#f2f0f4 45%,#a9a5ad);box-shadow:.3cqw .4cqw .4cqw rgba(0,0,0,.45)}
.staple.s1{left:22cqw;transform:rotate(-4deg)}.staple.s2{right:22cqw;transform:rotate(3deg)}
.eyebox{position:absolute;left:50%;top:21%;width:58cqw;transform:translateX(-50%)}
.eye{display:block;width:100%;height:auto}
.eye .eo{fill:var(--gold)}.eye .ei{fill:var(--candy)}.eye .ep{fill:var(--cream)}.eye .er{fill:var(--gold);opacity:.7}
.xer{position:absolute;inset:-4cqw;background-image:var(--xdots);
  background-size:1.3cqw 1.3cqw;opacity:.5}
.lore{position:absolute;left:50%;top:50%;transform:translate(-50%,0) rotate(-7deg);z-index:4;padding:1.6cqw 5cqw;
  border:1cqw solid transparent;border-image:linear-gradient(118deg,var(--cool) 8%,#8FD8B4 24%,#fff 38%,var(--accent-c) 52%,var(--gold) 68%,var(--cool) 84%,#fff 96%) 1;background:color-mix(in srgb,var(--plum) 72%,transparent);
  -webkit-mask-image:var(--stamp);mask-image:var(--stamp);-webkit-mask-size:50cqw;mask-size:50cqw}
.lore span{display:block;font-family:var(--didone);font-weight:900;font-size:21cqw;line-height:.95;letter-spacing:.06em;
  font-variation-settings:'opsz' 144;background:linear-gradient(118deg,var(--cool) 8%,#8FD8B4 24%,#fff 38%,var(--accent-c) 52%,var(--gold) 68%,var(--cool) 84%,#fff 96%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lore.pixel{border:1cqw solid var(--candy);border-image:none;-webkit-mask-image:none;mask-image:none;background:var(--plum);box-shadow:1cqw 1cqw 0 var(--candy)}
.lore.pixel span{font-family:var(--pixel);font-weight:700;font-size:16cqw;letter-spacing:.04em;background:none;color:var(--candy);-webkit-text-fill-color:var(--candy)}
.bk .scrawl{position:absolute;left:12cqw;right:12cqw;top:73%;text-align:center;font-family:var(--marker);color:var(--candy);
  font-size:6.6cqw;line-height:1.05;transform:rotate(-3deg);text-wrap:balance}
.bk .sub{position:absolute;left:0;right:0;bottom:11%;text-align:center;font-family:var(--mono);font-size:2.6cqw;

<style>
html,body{background:var(--plum);color:var(--cream);font-family:var(--body);min-height:100%}
body{overflow-x:hidden;-webkit-font-smoothing:antialiased}
.ground{position:fixed;inset:0;z-index:-1;background-color:var(--plum);
  background-image:radial-gradient(circle,color-mix(in srgb,var(--candy) 22%,transparent) 0 1.4px,transparent 2px);background-size:11px 11px}
.ground::after{content:"";position:absolute;inset:0;background:var(--grain) 0 0/240px 240px;opacity:.5;mix-blend-mode:multiply}
main{max-width:1180px;margin:0 auto;padding:18px 16px 64px}
header{text-align:center;padding:6px 0 10px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
h1{font-size:clamp(22px,7vw,62px);margin:8px 0 6px;line-height:1}
h1 .ransom{transform:rotate(-2deg)}
h1 .ransom span{box-shadow:2px 3px 5px rgba(12,2,8,.45)}
.lede{font-family:var(--mono);font-size:13px;color:var(--cream);opacity:.85;max-width:34em;margin:0 auto}
.panel{display:grid;gap:12px;margin:18px auto 8px;max-width:760px}
.fields{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:620px){.fields{grid-template-columns:1fr 1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
label.f input{font:16px var(--mono);letter-spacing:0;text-transform:none;color:var(--ink);background:var(--cream);border:2px solid var(--gold);
  border-radius:4px;padding:10px 12px;width:100%}
label.f input:focus{outline:3px solid var(--candy);outline-offset:1px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.row .lab{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);width:100%;text-align:center}
.chip{font:13px var(--mono);color:var(--cream);background:transparent;border:2px solid var(--candy);border-radius:999px;padding:8px 14px;cursor:pointer;
  min-height:40px;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--candy);color:var(--ink)}
.chip:disabled{opacity:1;cursor:default}
.chip .new{font-family:var(--pixel);font-size:10px;background:var(--gold);color:var(--ink);padding:2px 5px;border-radius:3px}
.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{font:700 15px var(--tag);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:var(--gold);border:0;border-radius:4px;
  padding:12px 20px;cursor:pointer;min-height:44px;box-shadow:3px 4px 0 var(--wine)}
.btn.alt{background:var(--cream)}
.btn.ghost{background:transparent;color:var(--cream);border:2px solid var(--cream);box-shadow:none}
.btn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--wine)}
.tools{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;font:12px var(--mono);color:var(--cream)}
.tools label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.tools input[type=file]{display:none}
/* the deck */
.table{display:flex;flex-direction:column;align-items:center;gap:14px;margin:18px 0 6px}
.deck{position:relative;width:150px;height:257px}
.deck .d{position:absolute;inset:0;transition:transform .5s cubic-bezier(.3,.7,.2,1)}
.deck .d .card{position:absolute;inset:0;width:100%;height:100%;box-shadow:3px 5px 10px rgba(12,2,8,.45);border-radius:6px}
.deck .d:nth-child(1){transform:translate(-4px,4px) rotate(-3deg)}.deck .d:nth-child(2){transform:translate(-2px,2px) rotate(-1.5deg)}
.deck .d:nth-child(4){transform:translate(2px,-2px) rotate(1.4deg)}.deck .d:nth-child(5){transform:translate(4px,-4px) rotate(2.6deg)}
.deck.riffle .d:nth-child(odd){animation:riffL .95s cubic-bezier(.4,.1,.3,1)}
.deck.riffle .d:nth-child(even){animation:riffR .95s cubic-bezier(.4,.1,.3,1)}
@keyframes riffL{0%{transform:none}35%{transform:translateX(-62%) rotate(-12deg)}55%{transform:translateX(-58%) rotate(-10deg) translateY(-6px)}100%{transform:none}}
@keyframes riffR{0%{transform:none}35%{transform:translateX(62%) rotate(12deg)}60%{transform:translateX(56%) rotate(9deg) translateY(-10px)}100%{transform:none}}
.status{font:13px var(--mono);color:var(--gold);min-height:1.4em;text-align:center}
/* the spread */
.spread{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 8vw 24px;margin:0 -16px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.spread::-webkit-scrollbar{display:none}
@media (min-width:900px){.spread{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,300px));justify-content:center;overflow:visible;padding:10px 0 24px;margin:0}}
.slot{flex:0 0 min(78vw,300px);scroll-snap-align:center;display:flex;flex-direction:column;gap:10px;--sw:min(78vw,300px)}
@media (min-width:900px){.slot{--sw:100%}}
.pos{font-family:var(--marker);color:var(--candy);font-size:21px;line-height:1.05;transform:rotate(-2deg);min-height:1.1em}
.pos small{display:block;font:11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);transform:none;margin-top:3px}
.stage{position:relative;width:100%;aspect-ratio:70/120;perspective:1400px}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.7,.2,1);cursor:pointer}
.flip.open{transform:rotateY(180deg);cursor:default}
.side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px;overflow:hidden;
  box-shadow:6px 10px 18px rgba(12,2,8,.5)}
.side.front{transform:rotateY(180deg)}
.side .card{position:absolute;inset:0;width:100%;height:100%}
.flip:not(.open):hover{transform:translateY(-4px) rotate(-1deg)}
.flip:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
/* riso misregistration flash on reveal */
.stage.riso::before,.stage.riso::after{content:"";position:absolute;inset:0;border-radius:6px;pointer-events:none;z-index:5}
.stage.riso::before{background:var(--candy);mix-blend-mode:screen;animation:misA .55s ease-out forwards}
.stage.riso::after{background:var(--cool);mix-blend-mode:multiply;animation:misB .55s ease-out forwards}
.stage.riso .side.front{animation:jolt .55s ease-out}
@keyframes misA{0%{opacity:.85;transform:translate(-9px,5px)}100%{opacity:0;transform:none}}
@keyframes misB{0%{opacity:.7;transform:translate(8px,-6px)}100%{opacity:0;transform:none}}
@keyframes jolt{0%{filter:drop-shadow(-6px 3px 0 var(--candy)) drop-shadow(6px -3px 0 var(--cool))}100%{filter:none}}
/* the hook you write */
.hook{background:#FFFBF8;color:var(--ink);padding:14px 14px 12px;border-radius:2px;transform:rotate(-.6deg);
  box-shadow:0 8px 16px rgba(12,2,8,.35);visibility:hidden}
.slot.revealed .hook{visibility:visible}
.hook .txt{font:15px/1.6 var(--mono)}
.hook .fill{background:color-mix(in srgb,var(--candy) 82%,transparent);border-radius:.35em .6em .4em .55em;padding:.04em .3em;
  outline:none;-webkit-box-decoration-break:clone;box-decoration-break:clone;min-width:2ch;display:inline}
.hook .fill.open{color:color-mix(in srgb,var(--ink) 62%,transparent);font-style:italic}
.hook .fill:focus{box-shadow:0 0 0 2px var(--magenta)}
.hook .acts{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.hook .copy{font:12px var(--mono);letter-spacing:.14em;text-transform:uppercase;background:var(--plum);color:var(--cream);border:0;border-radius:3px;padding:8px 12px;cursor:pointer;min-height:36px}
.hook .ok{font:12px var(--mono);color:var(--magenta)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--cream);opacity:.35}
.dots i.on{background:var(--candy);opacity:1}
@media (min-width:900px){.dots{display:none}}
.after{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
footer{text-align:center;font:12px var(--mono);color:var(--cream);opacity:.75;margin-top:30px}
footer a{color:var(--gold)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.flip,.deck .d{transition:none}.deck.riffle .d{animation:none}.stage.riso::before,.stage.riso::after,.stage.riso .side.front{animation:none;opacity:0}}
</style>
</head>

<script>
(function () {
  "use strict";

  function store(key, value) {

    catch (err) { state.noStore = String(err); }
  }
  function recall(key) {

  function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

    return function () { a += 0x6D2B79F5; var t = a; t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  function say(msg) { $("status").textContent = msg; }

  /* ---------- spreads and sets ---------- */
  var SPREAD_NAMES = { one: "One card", two: "Two", three: "Three", full: "Full spread" };
  Object.keys(D.spreads).forEach(function (k) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.dataset.spread = k;

    b.addEventListener("click", function () { state.spread = k; paintChips(); store("spread", k); });
    $("spreads").appendChild(b);
  });
  var today = new Date();
  D.sets.forEach(function (s) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.dataset.set = s.set;
    var age = (today - new Date(s.released + "T00:00:00")) / 864e5;
    b.innerHTML = esc(s.name) + (s.set !== "core" && age >= 0 && age <= 30 ? " <span class='new'>new</span>" : "");
    b.title = s.theme;
    if (s.set === "core") { b.disabled = true; b.title = "Always in the deck. " + s.theme; }
    else b.addEventListener("click", function () { state.sets[s.set] = !state.sets[s.set]; paintChips(); store("sets", state.sets); });
    $("sets").appendChild(b);
  });
  function paintChips() {
    document.querySelectorAll("[data-spread]").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.spread === state.spread); });
    document.querySelectorAll("[data-set]").forEach(function (b) { b.setAttribute("aria-pressed", !!state.sets[b.dataset.set] || b.dataset.set === "core"); });
  }
  var savedSpread = recall("spread"), savedSets = recall("sets");

  if (savedSets) Object.keys(savedSets).forEach(function (k) { state.sets[k] = savedSets[k]; });
  state.sets.core = true;
  if (params.get("auto")) state.spread = params.get("auto");
  if (params.get("sets")) params.get("sets").split(",").forEach(function (k) { state.sets[k] = true; });
  paintChips();
  ["topic", "audience"].forEach(function (k) {

    $(k).addEventListener("input", function () { store(k, $(k).value); fillAll(); });
  });

  /* ---------- the deck ---------- */
  var BACK = {}; D.sets.forEach(function (s) { BACK[s.set] = s.back; });
  $("deck").innerHTML = new Array(6).join("<div class='d'>" + BACK.core + "</div>");
  function pool() { return D.cards.filter(function (c) { return c.set === "core" || state.sets[c.set]; }); }
  function shuffle() {
    var d = $("deck"); d.classList.remove("riffle"); void d.offsetWidth; d.classList.add("riffle");
    say("Shuffled " + pool().length + " cards.");
  }
  $("deck").addEventListener("animationend", function () { $("deck").classList.remove("riffle"); });
  $("shuffle").addEventListener("click", shuffle);

  function draw(n) {
    var cards = pool().slice(), r = state.seed === null ? Math.random : rng(state.seed);
    for (var i = cards.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var t = cards[i]; cards[i] = cards[j]; cards[j] = t; }
    return cards.slice(0, n);
  }

  /* ---------- the hook text with live blanks ---------- */
  function slotValue(name) {
    var topic = $("topic").value.trim(), audience = $("audience").value.trim();

  function hookHtml(structure) {

        return "<span class='fill open' contenteditable='true' spellcheck='true' data-slot='" + esc(name) +
          "' aria-label='" + esc(name) + "'>" + esc(name) + "</span>";

      return esc(part);
    }).join("");
  }
  function fillAll() {
    document.querySelectorAll(".hook .fill").forEach(function (f) {
      if (f.dataset.mine) return;
      var v = slotValue(f.dataset.slot);
      f.textContent = v || f.dataset.slot;
      f.classList.toggle("open", !v);
    });
    document.querySelectorAll(".slot").forEach(mirror);
  }
  function mirror(slot) {  // the card face shows the same words as the slip below it
    var fills = slot.querySelectorAll(".hook .fill"), blanks = slot.querySelectorAll(".side.front .blank");
    blanks.forEach(function (b, i) {
      if (!fills[i]) return;
      var open = fills[i].classList.contains("open");
      b.innerHTML = "<i class='br'>{</i>" + esc(open ? fills[i].dataset.slot : fills[i].textContent) + "<i class='br'>}</i>";
    });
  }
  function hookText(slot) {
    var out = "";
    slot.querySelector(".hook .txt").childNodes.forEach(function (n) {
      out += n.nodeType === 1 && n.classList.contains("open") ? "{" + n.dataset.slot + "}" : n.textContent;
    });
    return out.replace(/\s+/g, " ").trim();

  function copyHook(slot) {

      var t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
      var worked = document.execCommand && document.execCommand("copy"); t.remove();
      ok.textContent = worked ? "copied" : "select the text to copy";
    }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback);

  /* ---------- deal and reveal ---------- */

      slot.className = "slot"; slot.dataset.id = c.id;
      slot.innerHTML = "<div class='pos'>" + esc(p.label) + "<small>" + esc(p.note) + "</small></div>" +

        "<div class='side back'>" + BACK[c.set] + "</div><div class='side front'>" + c.face + "</div></div></div>" +
        "<div class='hook'><div class='txt'>" + hookHtml(c.structure) + "</div>" +
        "<div class='acts'><span class='ok' aria-live='polite'></span><button class='copy' type='button'>copy hook</button></div></div>";
      var flip = slot.querySelector(".flip");

  }
  var audio = null;
  function chime() {
    if (!$("sound").checked) return;
    var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    audio = audio || new AC();
    [660, 990, 1320].forEach(function (f, i) {
      var o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + i * .07;
      o.type = "triangle"; o.frequency.value = f; g.gain.setValueAtTime(0, t);

    document.querySelectorAll(".slot").forEach(function (s, i) { setTimeout(function () { reveal(s); }, i * 260); });
  });

  /* ---------- re-tone from style.json ---------- */

  var ROLES = { masthead: "--didone", label: "--tag", body: "--body", scrawl: "--marker", script: "--script", mono: "--mono" };

    var g = c.getContext("2d"); g.globalAlpha = opacity; g.fillStyle = hex;
    g.beginPath(); g.arc(px / 2, px / 2, r / 10 * px, 0, Math.PI * 2); g.fill();
    return "url('" + c.toDataURL() + "')";
  }
  function stampTile() {  // uneven stamp ink: mostly solid, seeded speckles and thin patches
    var px = 96, c = document.createElement("canvas"); c.width = c.height = px;
    var g = c.getContext("2d"), img = g.createImageData(px, px), r = rng(11), blots = [];
    for (var k = 0; k < 14; k++) blots.push([r() * px, r() * px, 3 + r() * 6]);
    for (var y = 0; y < px; y++) for (var x = 0; x < px; x++) {
      var a = r() > .1 ? 255 : 40 + Math.floor(r() * 120);
      blots.forEach(function (b) { if ((x - b[0]) * (x - b[0]) + (y - b[1]) * (y - b[1]) < b[2] * b[2]) a = Math.min(a, 110); });
      img.data[(y * px + x) * 4 + 3] = a;
    }
    g.putImageData(img, 0, 0);
    return "url('" + c.toDataURL() + "')";
  }
  document.documentElement.style.setProperty("--stamp", stampTile());
  function paintTiles(pal) {
    var root = document.documentElement.style, ok = /^#[0-9A-Fa-f]{6}$/;
    var col = function (k, d) { return ok.test(pal[k] || "") ? pal[k] : d; };
    var accent = col("accent", "#FE9DCA");
    root.setProperty("--dots-a", dotTile(accent, .55, 2.2)); root.setProperty("--dots-c", dotTile(accent, .22, 2.2));
    root.setProperty("--dots-y", dotTile(col("marker", "#C2246E"), .16, 2.2));
    root.setProperty("--xdots", dotTile(col("plum", "#50163C"), 1, 2.7)); root.setProperty("--washi", dotTile(col("gold", "#E9B949"), 1, 1.6));
    root.setProperty("--disc-candy", dotTile(accent, 1, 2.5)); root.setProperty("--disc-gold", dotTile(col("gold", "#E9B949"), 1, 2.5));
    root.setProperty("--disc-cool", dotTile(col("cool", "#B9B3F5"), 1, 2.5)); root.setProperty("--disc-magenta", dotTile(col("marker", "#C2246E"), 1, 2.5));
  }
  paintTiles(D.style.palette);
  function retone(style) {
    var pal = style.palette || {}, fonts = style.fonts || {}, root = document.documentElement.style, ok = /^#[0-9A-Fa-f]{6}$/;
    Object.keys(VARS).forEach(function (v) { if (ok.test(pal[VARS[v]] || "")) root.setProperty("--" + v, pal[VARS[v]]); });
    paintTiles(pal);
    var fams = [];
    Object.keys(ROLES).forEach(function (role) {
      var f = fonts[role];
      if (typeof f === "string" && /^[A-Za-z0-9 ]{1,60}$/.test(f)) {
        root.setProperty(ROLES[role], "'" + f + "'," + getComputedStyle(document.documentElement).getPropertyValue(ROLES[role]));
        fams.push("family=" + f.trim().replace(/ /g, "+"));
      }
    });
    if (fams.length) {
      var l = document.createElement("link"); l.rel = "stylesheet";
      l.href = "https://fonts.googleapis.com/css2?" + fams.join("&") + "&display=swap"; document.head.appendChild(l);
    }
    say("Re-toned from " + (style.name || "your style.json") + ".");
  }
  $("stylefile").addEventListener("change", function (e) {
    var file = e.target.files[0]; if (!file) return;
    file.text().then(function (t) { retone(JSON.parse(t)); }).catch(function (err) { say("That style.json could not be read: " + err.message); });
  });
  if (location.protocol !== "file:" && !TEST) {  // served from a folder with a style.json in it
    fetch("style.json").then(function (r) { return r.ok ? r.json() : null; })
      .then(function (s) { if (s) retone(s); })
      .catch(function () { say(""); });
  }

  /* ---------- save the spread as a 1080 x 1920 story ---------- */
  function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function wrap(g, text, maxW) {
    var words = text.split(" "), lines = [], line = "";
    words.forEach(function (w) { var t = line ? line + " " + w : w; if (g.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; });
    if (line) lines.push(line); return lines;
  }
  function paintStory(canvas, withImages) {
    var W = 1080, H = 1920, g = canvas.getContext("2d"), slots = Array.prototype.slice.call(document.querySelectorAll(".slot"));
    var shown = slots.filter(function (s) { return s.classList.contains("revealed"); });
    if (!shown.length) shown = slots;
    g.fillStyle = cssVar("--plum"); g.fillRect(0, 0, W, H);
    g.fillStyle = cssVar("--candy"); g.globalAlpha = .22;
    for (var y = 6; y < H; y += 22) for (var x = 6; x < W; x += 22) { g.beginPath(); g.arc(x, y, 2.6, 0, 6.3); g.fill(); }
    g.globalAlpha = 1; g.strokeStyle = cssVar("--gold"); g.lineWidth = 6; g.strokeRect(36, 36, W - 72, H - 72);
    g.lineWidth = 2; g.strokeRect(54, 54, W - 108, H - 108);
    g.textAlign = "center"; g.fillStyle = cssVar("--gold"); g.font = "500 26px " + cssVar("--mono");
    g.fillText("R O C H E V E R S E", W / 2, 130);
    g.fillStyle = cssVar("--cream"); g.font = "900 92px " + cssVar("--didone"); g.fillText("HOOK ORACLE", W / 2, 228);
    var topic = $("topic").value.trim(), audience = $("audience").value.trim();
    g.font = "26px " + cssVar("--mono"); g.fillStyle = cssVar("--candy");
    if (topic || audience) g.fillText([topic, audience].filter(Boolean).join("  for  "), W / 2, 280);
    var top = 320, bottom = H - 120, each = (bottom - top) / shown.length, size = shown.length > 4 ? 26 : 34;
    shown.forEach(function (slot, i) {
      var y0 = top + i * each, label = slot.querySelector(".pos").firstChild.textContent;
      var name = slot.querySelector(".side.front .name").textContent, text = hookText(slot);
      var img = withImages ? slot.querySelector(".side.front img.obj") : null, textX = 130, maxW = W - 260;
      if (img && img.complete && img.naturalWidth) {
        var h = Math.min(each - 40, 220), w = h * img.naturalWidth / img.naturalHeight;
        g.drawImage(img, W - 110 - w, y0 + 20, w, h); maxW = W - 300 - w;
      }
      g.textAlign = "left"; g.fillStyle = cssVar("--candy"); g.font = Math.round(size * 1.1) + "px " + cssVar("--marker");
      g.fillText(label, textX, y0 + size * 1.3);
      g.fillStyle = cssVar("--cream"); g.font = "900 " + Math.round(size * 1.3) + "px " + cssVar("--didone");
      g.fillText(name, textX, y0 + size * 2.9);
      var fs = size; g.font = fs + "px " + cssVar("--mono");
      var lines = wrap(g, text, maxW);
      while (lines.length * fs * 1.4 > each - size * 3.6 - 20 && fs > 16) { fs -= 1; g.font = fs + "px " + cssVar("--mono"); lines = wrap(g, text, maxW); }
      var sy = y0 + size * 3.6;
      g.fillStyle = "#FFFBF8"; g.fillRect(textX - 20, sy - 6, maxW + 40, lines.length * fs * 1.4 + 22);
      g.fillStyle = cssVar("--ink");
      lines.forEach(function (ln, k) { g.fillText(ln, textX, sy + fs * 1.1 + k * fs * 1.4); });
    });
    g.textAlign = "center"; g.fillStyle = cssVar("--gold"); g.font = "22px " + cssVar("--mono");
    g.fillText("pull your own: the HOOK ORACLE, free from the Rocheverse", W / 2, H - 78);
  }
  function story() {
    var canvas = document.createElement("canvas"); canvas.width = 1080; canvas.height = 1920;
    paintStory(canvas, true);
    try { canvas.toDataURL("image/png"); }
    catch (err) {  // pictures read from file:// lock the canvas; the words-only story still saves
      if (err.name !== "SecurityError") throw err;
      canvas = document.createElement("canvas"); canvas.width = 1080; canvas.height = 1920; paintStory(canvas, false);
    }
    return canvas;
  }
  $("save").addEventListener("click", function () {
    var c = story(), a = document.createElement("a");
    a.download = "hook-oracle-spread.png"; a.href = c.toDataURL("image/png"); document.body.appendChild(a); a.click(); a.remove();
    say("Saved hook-oracle-spread.png (1080 x 1920).");
  });

  window.HookOracle = { story: story, deal: deal, reveal: reveal };

  /* ---------- test hooks: #auto=three&seed=7&reveal=all&export=1 ---------- */
  if (TEST) {
    state.seed = parseInt(params.get("seed") || "1", 10);
    $("topic").value = params.get("topic") || "my spring retreat";
    $("audience").value = params.get("audience") || "burnt-out founders";
    deal();
    var rv = params.get("reveal"), slots = document.querySelectorAll(".slot");
    var n = rv === "all" ? slots.length : parseInt(rv || "0", 10);
    for (var i = 0; i < n && i < slots.length; i++) reveal(slots[i]);
    var b = document.body.dataset;
    b.dealt = state.dealt.map(function (c) { return c.id; }).join(",");
    b.revealed = document.querySelectorAll(".slot.revealed").length;
    b.sw = document.documentElement.scrollWidth;
    b.slots = slots.length;
    if (params.get("export")) { var c = story(); b.export = c.width + "x" + c.height; b.exportPng = c.toDataURL("image/png").length > 1000 ? "1" : "0"; }
    b.ready = "1";
  }
})();
</script>
